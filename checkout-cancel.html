<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skyland Checkout Canceled</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page" id="checkout-cancel">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Skyland</span>
        </div>
        <nav class="nav">
          <a class="nav-pill" href="index.html">Home</a>
          <a class="nav-pill is-active" href="store.html">Store</a>
          <a class="nav-pill" href="info.html">Info</a>
        </nav>
      </header>

      <main>
        <section class="checkout">
          <span class="section-pill">CHECKOUT</span>
          <h2>Checkout Canceled</h2>
          <p class="section-subtitle">No payment was made. You can try again anytime.</p>

          <div class="checkout-card">
            <div class="checkout-actions">
              <a class="btn btn-primary" href="store.html">Return to Store</a>
              <a class="btn btn-secondary" href="index.html">Go Home</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div>© 2026 Skyland — A Skyblock Adventure</div>
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="store.html">Store</a>
          <a href="info.html">Info</a>
        </div>
      </footer>
    </div>
  </body>
</html>
